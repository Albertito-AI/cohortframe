name: CohortFrame checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install .
      - name: Verify project, jobs and real rendering
        run: python -m unittest discover -s tests -v
      - name: Inspect capabilities
        run: python -m cohortframe capabilities

      - name: Check composer contract and JavaScript syntax
        run: |
          node --check src/cohortframe/studio/app.js
          node --test tests/test_studio.cjs
      - name: Verify packaged offline interface
        run: |
          cohortframe studio --output /tmp/cohortframe-studio
          test -f /tmp/cohortframe-studio/index.html
          cohortframe validate examples/intro.json
