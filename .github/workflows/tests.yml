name: CohortFrame checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install .
      - name: Verify project, jobs and real rendering
        run: python -m unittest discover -s tests -v
      - name: Inspect capabilities
        run: python -m cohortframe capabilities

      - name: Check composer contract and JavaScript syntax
        run: |
          node --check src/cohortframe/studio/app.js
          node --test tests/test_studio.cjs
      - name: Verify packaged offline interface
        run: |
          cohortframe studio --output /tmp/cohortframe-studio
          test -f /tmp/cohortframe-studio/index.html
          cohortframe validate examples/intro.json
      - name: Install pinned browser acceptance tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cohortframe-browser" --no-save --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/cohortframe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise the installed composer in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/cohortframe-browser/node_modules
        run: |
          node tests/browser_acceptance.cjs
          cohortframe validate browser-results/desktop-brief.json
          cohortframe validate browser-results/mobile-brief.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cohortframe-browser-evidence
          path: browser-results/
          retention-days: 14
          if-no-files-found: warn
