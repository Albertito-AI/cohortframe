[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortframe"
version = "0.2.0"
description = "Agent-operated local video composition with inspectable jobs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Albert Tan and the CohortFrame contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video"]

[project.scripts]
cohortframe = "cohortframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]



[tool.setuptools.package-data]
cohortframe = ["studio/*.html", "studio/*.css", "studio/*.js", "studio/*.svg"]

[project.urls]
Homepage = "https://github.com/Albertito-AI/cohortframe"
Issues = "https://github.com/Albertito-AI/cohortframe/issues"
